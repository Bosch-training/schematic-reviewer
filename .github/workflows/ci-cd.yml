name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHON_DEPENDENCIES: "fastapi uvicorn pydantic pymupdf==1.26.4 openpyxl pytest ruff"

jobs:
  build-test:
    name: 1. Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install $PYTHON_DEPENDENCIES

      - name: Build (byte-compile all Python sources)
        run: python -m compileall -q api comparison extraction frontend reporting validation models.py safe_logging.py

      - name: Run unit tests
        run: pytest

  lint-format:
    name: 2. Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  vulnerability-scan:
    name: 3. Vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install $PYTHON_DEPENDENCIES

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit

      - name: Filesystem scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-aws:
    name: 4. Deploy to AWS (EC2)
    runs-on: ubuntu-latest
    needs: [build-test, lint-format, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - name: Create wishes.txt on EC2 over SSH
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh -i "$key_file" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "ubuntu@${EC2_HOST}" \
            "printf '%s\n' 'Happy Diwali !!!' > /home/ubuntu/wishes.txt"
