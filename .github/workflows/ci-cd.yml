name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHON_DEPENDENCIES: "fastapi uvicorn pydantic pymupdf==1.26.4 openpyxl pytest ruff"

jobs:
  build-test:
    name: 1. Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install $PYTHON_DEPENDENCIES

      - name: Build (byte-compile all Python sources)
        run: python -m compileall -q api comparison extraction frontend reporting validation models.py safe_logging.py

      - name: Run unit tests
        run: pytest

  lint-format:
    name: 2. Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  vulnerability-scan:
    name: 3. Vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install $PYTHON_DEPENDENCIES

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit

      - name: Filesystem scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  package:
    name: 4. Package
    runs-on: ubuntu-latest
    needs: [build-test, lint-format, vulnerability-scan]
    steps:
      - uses: actions/checkout@v5

      - name: Create deployment archive
        run: >
          tar --exclude=__pycache__ -czf schematic-reviewer.tar.gz
          api comparison extraction frontend reporting validation
          models.py safe_logging.py requirements.txt Dockerfile docker-compose.yml

      - uses: actions/upload-artifact@v7
        with:
          name: schematic-reviewer
          path: schematic-reviewer.tar.gz
          if-no-files-found: error

  deploy-aws:
    name: 5. Deploy to AWS (EC2)
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: schematic-reviewer

      - name: Copy package to EC2 and restart container
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          ssh "${ssh_opts[@]}" "ubuntu@${EC2_HOST}" \
            "printf '%s\n' 'Happy Diwali !!!' > /home/ubuntu/wishes.txt"

          scp "${ssh_opts[@]}" schematic-reviewer.tar.gz "ubuntu@${EC2_HOST}:/home/ubuntu/"

          ssh "${ssh_opts[@]}" "ubuntu@${EC2_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          rm -rf /home/ubuntu/schematic-reviewer
          mkdir -p /home/ubuntu/schematic-reviewer
          tar -xzf /home/ubuntu/schematic-reviewer.tar.gz -C /home/ubuntu/schematic-reviewer
          cd /home/ubuntu/schematic-reviewer
          docker compose down
          docker compose up -d
          docker compose ps
          EOF
